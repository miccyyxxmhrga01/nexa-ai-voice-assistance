<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111c1a">
  <title>Nexa</title>
  <link rel="icon" type="image/x-icon" href="/static/nexa.ico?v=nexa-3">
  <link rel="stylesheet" href="/static/style.css?v=nexa-particles-1">
</head>
<body>
  <main class="orb-scene" aria-label="Nexa voice assistant">
    <canvas id="orb" class="orb-world" tabindex="0" role="button" aria-label="Talk to Nexa. Press Escape to end a conversation."></canvas>
    <div id="orbSpot" class="orb-spot" aria-hidden="true"></div>
    <section id="hud" class="hud" hidden aria-labelledby="hudTitle" aria-busy="false">
      <div class="hud-signal" aria-hidden="true"><span></span></div>
      <header class="hud-head">
        <div class="hud-channel"><span class="hud-mark" aria-hidden="true"></span>Nexa<span class="hud-divider" aria-hidden="true">/</span>Visual channel</div>
        <button id="hudClose" class="hud-close" type="button" aria-label="Hide display" title="Hide display">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>
        </button>
      </header>
      <h1 id="hudTitle" class="hud-title"></h1>
      <div class="hud-loading" aria-hidden="true"><i></i><i></i><i></i></div>
      <div id="hudBody" class="hud-body" tabindex="0" aria-label="Requested content"></div>
      <footer class="hud-foot">
        <span id="hudStatus" class="hud-status" role="status" aria-live="polite"></span>
        <nav id="hudSources" class="hud-sources" hidden aria-label="Sources"></nav>
      </footer>
    </section>
  </main>
  <script src="/static/orb3d.js?v=nexa-particles-1"></script>
  <script src="/static/hud.js?v=nexa-hud-1"></script>
  <script src="/static/app.js?v=nexa-particles-1"></script>
</body>
</html>
